<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="575" viewBox="0 0 1000 575" role="img" aria-label="The system map: files come in through the browser or a bucket, are stored in Postgres, matched by a pure engine run by a worker, shown through the API and dashboard, with an optional model and alerts on the side" xmlns="http://www.w3.org/2000/svg"><style>
svg{--svg-bg:#ffffff;--svg-store:#edf1f5;--svg-line:#c4cfda;--svg-surface:#ffffff;--svg-ink:#14202b;--svg-muted:#566676;--svg-code:#0b6e69;--svg-code-fill:#e1f1ef;--svg-model:#96580a;--svg-model-fill:#fbefd8;--svg-font:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;--svg-mono:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){svg{--svg-bg:#0d141a;--svg-store:#18232c;--svg-line:#33444f;--svg-surface:#131d25;--svg-ink:#e5edf3;--svg-muted:#97a9b8;--svg-code:#52c7bd;--svg-code-fill:#12302e;--svg-model:#e3a84a;--svg-model-fill:#33270f}}

.db{fill:var(--svg-store);stroke:var(--svg-line);stroke-width:1.2;stroke-dasharray:4 3}
.code{fill:var(--svg-code-fill);stroke:var(--svg-code);stroke-width:1.5}
.store{fill:var(--svg-store);stroke:var(--svg-line);stroke-width:1.4}
.ext{fill:var(--svg-surface);stroke:var(--svg-line);stroke-width:1.4}
.model{fill:var(--svg-model-fill);stroke:var(--svg-model);stroke-width:1.5;stroke-dasharray:6 4}
.t{font:600 13px var(--svg-font);fill:var(--svg-ink)}
.s{font:400 11px var(--svg-font);fill:var(--svg-muted)}
.l{font:400 11px var(--svg-font);fill:var(--svg-muted)}
.g{font:600 12px var(--svg-font);fill:var(--svg-muted)}
.n{font:600 13px var(--svg-mono);fill:var(--svg-code)}
.arrow{fill:none;stroke:currentColor;stroke-width:1.5;color:var(--svg-muted)}
.arrow.dashed{stroke-dasharray:5 4}
</style><rect width="1000" height="575" fill="var(--svg-bg)"/><defs><marker id="arrMap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><polygon points="0,0 10,5 0,10" fill="currentColor"/></marker></defs><rect class="db" x="500" y="30" width="250" height="400" rx="12"/><text class="g" x="515" y="52">Postgres, the only database</text><rect class="store" x="515" y="70" width="220" height="56" rx="8"/><text class="t" x="527" y="92">File versions + records</text><text class="s" x="527" y="110">never edited</text><rect class="store" x="515" y="140" width="220" height="56" rx="8"/><text class="t" x="527" y="162">Runs + results</text><text class="s" x="527" y="180">matches and exceptions</text><rect class="store" x="515" y="210" width="220" height="56" rx="8"/><text class="t" x="527" y="232">Cases + event log</text><text class="s" x="527" y="250">append-only history</text><rect class="store" x="515" y="280" width="220" height="56" rx="8"/><text class="t" x="527" y="302">Job queue</text><text class="s" x="527" y="320">leases and retries</text><rect class="store" x="515" y="350" width="220" height="56" rx="8"/><text class="t" x="527" y="372">Alert log + ingest log</text><text class="s" x="527" y="390">what was sent, what was read</text><rect class="ext" x="20" y="40" width="170" height="46" rx="8"/><text class="t" x="32" y="62">Sample data</text><text class="s" x="32" y="80">generated, not real</text><rect class="ext" x="20" y="110" width="170" height="46" rx="8"/><text class="t" x="32" y="132">Your CSV upload</text><text class="s" x="32" y="150">from the browser</text><rect class="ext" x="20" y="430" width="170" height="56" rx="8"/><text class="t" x="32" y="452">Your S3 bucket</text><text class="s" x="32" y="470">&lt;profile&gt;/&lt;month&gt;/&lt;source&gt;.csv</text><rect class="code" x="250" y="80" width="190" height="100" rx="8"/><text class="t" x="262" y="102">Intake</text><text class="s" x="262" y="120">read the CSV</text><text class="s" x="262" y="135">apply the column mapping</text><text class="s" x="262" y="150">hash it, store a version</text><rect class="code" x="250" y="250" width="190" height="100" rx="8"/><text class="t" x="262" y="272">Matching engine</text><text class="s" x="262" y="290">pure code, no AI</text><text class="s" x="262" y="305">invoices vs payments</text><text class="s" x="262" y="320">deposits vs payouts</text><rect class="code" x="250" y="420" width="190" height="100" rx="8"/><text class="t" x="262" y="442">Worker</text><text class="s" x="262" y="460">runs the engine</text><text class="s" x="262" y="475">scans the bucket</text><text class="s" x="262" y="490">sends alerts, cleans up</text><rect class="ext" x="800" y="40" width="180" height="56" rx="8"/><text class="t" x="812" y="62">React dashboard</text><text class="s" x="812" y="80">what you look at</text><rect class="code" x="800" y="140" width="180" height="56" rx="8"/><text class="t" x="812" y="162">FastAPI</text><text class="s" x="812" y="180">the HTTP API</text><rect class="model" x="800" y="270" width="180" height="112" rx="8"/><text class="t" x="812" y="292">Language model</text><text class="s" x="812" y="310">optional, needs a key</text><text class="s" x="812" y="325">maps columns, suggests</text><text class="s" x="812" y="340">an invoice, explains a</text><text class="s" x="812" y="355">case; answers are checked</text><rect class="ext" x="800" y="440" width="180" height="56" rx="8"/><text class="t" x="812" y="462">Slack, Teams, email</text><text class="s" x="812" y="480">alerts and a digest</text><polyline class="arrow" points="190,63 250,108" marker-end="url(#arrMap)"/><polyline class="arrow" points="190,133 250,150" marker-end="url(#arrMap)"/><polyline class="arrow" points="440,130 515,98" marker-end="url(#arrMap)"/><text class="l" x="452" y="100" text-anchor="start">new version</text><polyline class="arrow" points="345,420 345,350" marker-end="url(#arrMap)"/><text class="l" x="354" y="392" text-anchor="start">runs it</text><polyline class="arrow" points="440,290 462,290 462,168 515,168" marker-end="url(#arrMap)"/><text class="l" x="456" y="236" text-anchor="end">records in,</text><text class="l" x="456" y="250" text-anchor="end">results out</text><polyline class="arrow" points="440,470 475,470 475,308 515,308" marker-end="url(#arrMap)"/><text class="l" x="468" y="458" text-anchor="end">claims jobs</text><polyline class="arrow" points="190,458 250,470" marker-end="url(#arrMap)"/><text class="l" x="220" y="446" text-anchor="middle">scanned</text><polyline class="arrow" points="440,500 775,500 775,468 800,468" marker-end="url(#arrMap)"/><text class="l" x="560" y="516" text-anchor="start">alerts, daily digest</text><polyline class="arrow" points="800,168 735,168" marker-end="url(#arrMap)"/><text class="l" x="880" y="214" text-anchor="end">reads and writes cases,</text><text class="l" x="880" y="228" text-anchor="end">queues jobs</text><polyline class="arrow" points="890,96 890,140" marker-end="url(#arrMap)"/><text class="l" x="898" y="122" text-anchor="start">API calls</text><polyline class="arrow dashed" points="890,196 890,270" marker-end="url(#arrMap)"/><text class="l" x="898" y="250" text-anchor="start">only if asked</text><rect class="code" x="20" y="545" width="16" height="12" rx="3"/><text class="s" x="44" y="555">my code, always deterministic</text><rect class="model" x="270" y="545" width="16" height="12" rx="3"/><text class="s" x="294" y="555">optional model, never decides a match</text><rect class="store" x="560" y="545" width="16" height="12" rx="3"/><text class="s" x="584" y="555">stored data</text><rect class="ext" x="700" y="545" width="16" height="12" rx="3"/><text class="s" x="724" y="555">outside the system / what you see</text></svg>
