name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recon
          POSTGRES_PASSWORD: recon
          POSTGRES_DB: recon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recon -d recon"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RECON_DATABASE_URL: postgresql+psycopg://recon:recon@localhost:5432/recon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check the generated API types match the OpenAPI file
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.ts

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the backend to report ready
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Check the app and the demo data are served
        run: |
          curl --fail --silent http://127.0.0.1:8000/ | grep --quiet '<div id="root">'
          curl --fail --silent http://127.0.0.1:8000/api/demo | grep --quiet '"corrected_files_loaded":false'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the browser test tooling
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the browser tests against the running stack
        working-directory: frontend
        run: npx playwright test
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
